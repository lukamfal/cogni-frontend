<style>
/* Layout: same system as the Next.js app — sticky top nav, 900px centred column, bottom tab bar on phones */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --gray-50: #f8f9f8;

  --gray-200: #e6e9e6;

  --accent-light: #e8f5ee;
  --nav-bg: rgba(255,255,255,0.92);
  --memory-color: #3a7bd5; --memory-bg: #eaf0fb;
  --math-color: #c06a2e;   --math-bg: #fdf0e6;
  --face-color: #b5507a;   --face-bg: #faeaf2;
  --word-color: #1a6b3c;   --word-bg: #e8f5ee;
  --good: #1a7f45; --good-bg: #e6f6ec;
  --bad: #b91c1c;  --bad-bg: #fef2f2; --bad-border: #fca5a5;
  --hint-bg: #fffbeb; --hint-border: #fde68a;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --font-display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius: 16px; --radius-sm: 10px; --radius-lg: 24px; --radius-xl: 32px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f0e; --surface: #151816; --gray-50: #121513; --gray-100: #1c201d; --gray-200: #2a2f2b; --gray-300: #3d443f;
    --ink: #f3f5f3; --ink-inverse: #0d0f0e; --text-secondary: #b4bab5; --text-muted: #7d847e;
    --accent: #4fbf7d; --accent-mid: #6dd096; --accent-light: #15281c; --nav-bg: rgba(13,15,14,0.9);
    --memory-color: #7aa7f0; --memory-bg: #17223a; --math-color: #e89a5f; --math-bg: #2e1f13;
    --face-color: #e584ad; --face-bg: #301a24; --word-color: #4fbf7d; --word-bg: #15281c;
    --good: #5fd08f; --good-bg: #133020; --bad: #f87171; --bad-bg: #2d1414; --bad-border: #7f2a2a;
    --hint-bg: #2a2410; --hint-border: #5c4d1a; --shadow: 0 2px 14px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f0e; --surface: #151816; --gray-50: #121513; --gray-100: #1c201d; --gray-200: #2a2f2b; --gray-300: #3d443f;
  --ink: #f3f5f3; --ink-inverse: #0d0f0e; --text-secondary: #b4bab5; --text-muted: #7d847e;
  --accent: #4fbf7d; --accent-mid: #6dd096; --accent-light: #15281c; --nav-bg: rgba(13,15,14,0.9);
  --memory-color: #7aa7f0; --memory-bg: #17223a; --math-color: #e89a5f; --math-bg: #2e1f13;
  --face-color: #e584ad; --face-bg: #301a24; --word-color: #4fbf7d; --word-bg: #15281c;
  --good: #5fd08f; --good-bg: #133020; --bad: #f87171; --bad-bg: #2d1414; --bad-border: #7f2a2a;
  --hint-bg: #2a2410; --hint-border: #5c4d1a; --shadow: 0 2px 14px rgba(0,0,0,0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 17px; }
body { font-family: var(--font-body); background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--nav-bg); }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance; }
button { font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; min-height: 48px; transition: all .18s ease; color: inherit; background: none; }
button:active { transform: scale(0.98); }
button:disabled { cursor: default; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
input, select { font-family: var(--font-body); font-size: 1rem; }

@keyframes fadeUp { from { opacity: .6; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.94); } 70% { transform: scale(1.02); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 50% { transform: translateX(7px); } 75% { transform: translateX(-4px); } }
.fade-up { animation: fadeUp .45s cubic-bezier(.16,1,.3,1) both; }
.pop { animation: pop .4s cubic-bezier(.34,1.56,.64,1) both; }
.shake { animation: shake .4s ease; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--surface); border: 1px solid var(--gray-200); border-radius: var(--radius); }
.btn-primary { background: var(--ink); color: var(--ink-inverse); border-radius: var(--radius-sm); padding: 14px 28px; font-weight: 700; width: 100%; }
.btn-primary:hover { opacity: .88; transform: translateY(-1px); }
.btn-outline { border: 1.5px solid var(--gray-300); border-radius: var(--radius-sm); padding: 13px 28px; width: 100%; }
.btn-outline:hover { background: var(--gray-50); }
.input-field { width: 100%; padding: 14px 16px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); color: var(--ink); background: var(--surface); outline: none; }
.input-field:focus { border-color: var(--ink); }
.input-field::placeholder { color: var(--text-muted); }
.label { font-size: .9rem; font-weight: 700; color: var(--text-secondary); }
.field { display: flex; flex-direction: column; gap: 6px; }
.section-label { font-size: .78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; }
.page-title { font-size: clamp(1.8rem, 5vw, 2.4rem); }
.page-sub { color: var(--text-secondary); font-size: .95rem; max-width: 60ch; }
.stack { display: flex; flex-direction: column; gap: 2rem; }
.proto-chip { font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-light); padding: 3px 8px; border-radius: 6px; }
.proto-note { text-align: center; font-size: .78rem; color: var(--text-muted); margin-top: 3rem; }
.toast { position: fixed; z-index: 80; left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--ink-inverse); padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: .88rem; box-shadow: var(--shadow); }

/* ---------- Landing ---------- */
.l-nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--nav-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--gray-200); }
.l-nav-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 1rem; max-width: 1100px; margin: 0 auto; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 36px; height: 36px; background: var(--ink); border-radius: 10px; display: grid; place-items: center; font-size: 18px; }
.logo-text { font-family: var(--font-display); font-size: 1.2rem; }
.l-links { display: flex; gap: 6px; align-items: center; }
.l-link { padding: 8px 14px; border-radius: 8px; font-size: .88rem; font-weight: 600; color: var(--text-secondary); min-height: 0; }
.l-link:hover { background: var(--gray-100); color: var(--ink); }
.l-cta { padding: 9px 18px; background: var(--ink); color: var(--ink-inverse); border-radius: 10px; font-size: .88rem; font-weight: 700; min-height: 0; }
.l-hero { max-width: 1100px; margin: 0 auto; padding-block: 4.5rem 3.5rem; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 3.5rem; align-items: center; }
.l-hero-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 1.4rem; }
.l-hero-copy .l-actions { justify-content: flex-start; }
.badge { background: var(--gray-100); border: 1px solid var(--gray-200); padding: 6px 16px; border-radius: 20px; font-size: .82rem; font-weight: 600; color: var(--text-secondary); }
.l-title { font-size: clamp(2.8rem, 8vw, 4.6rem); }
.l-title em { color: var(--accent); }
.l-desc { font-size: 1.05rem; color: var(--text-secondary); max-width: 520px; }
.l-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn-black { background: var(--ink); color: var(--ink-inverse); padding: 14px 28px; border-radius: 12px; font-weight: 700; }
.btn-black:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn-ghost { border: 1.5px solid var(--gray-200); padding: 14px 28px; border-radius: 12px; font-weight: 600; background: var(--surface); }
.btn-ghost:hover { background: var(--gray-50); }
.l-stats { display: flex; gap: 2.5rem; padding: 1.4rem 2.2rem; border: 1px solid var(--gray-200); border-radius: var(--radius); background: var(--gray-50); flex-wrap: wrap; justify-content: center; }
.l-stat-val { font-family: var(--font-display); font-size: 2rem; text-align: center; }
.l-stat-label { font-size: .78rem; color: var(--text-muted); font-weight: 600; text-align: center; }
.l-section { max-width: 900px; margin: 0 auto; padding-block: 4.5rem; }
.tag { display: inline-block; border: 1px solid var(--gray-200); border-radius: 20px; padding: 5px 14px; font-size: .8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 1rem; }
.l-h2 { font-size: clamp(1.8rem, 4.5vw, 2.8rem); margin-bottom: 2.4rem; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.l-game { padding: 2rem; border-radius: var(--radius-lg); transition: all .2s; }
.l-game:hover { box-shadow: var(--shadow); transform: translateY(-3px); }
.l-game-icon { font-size: 2.2rem; margin-bottom: .8rem; }
.l-game-name { font-weight: 800; margin-bottom: 4px; }
.l-game-desc { font-size: .87rem; color: var(--text-secondary); }
.l-features-band { background: var(--gray-50); }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
.l-feature { padding: 1.5rem; }
.l-feature-icon { font-size: 1.6rem; margin-bottom: .7rem; }
.l-feature-title { font-weight: 800; font-size: .92rem; margin-bottom: 4px; }
.l-feature-desc { font-size: .82rem; color: var(--text-secondary); }
.l-cta-box { max-width: 900px; margin: 3rem auto; background: var(--ink); color: var(--ink-inverse); border-radius: var(--radius-xl); padding: 4rem 2rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.l-cta-title { font-size: clamp(2rem, 5vw, 3rem); }
.l-cta-desc { opacity: .65; }
.btn-white { background: var(--ink-inverse); color: var(--ink); padding: 14px 32px; border-radius: 12px; font-weight: 700; }
.l-footer { text-align: center; padding-block: 2rem 4rem; color: var(--text-muted); font-size: .82rem; }

/* Hero "try it" card */
.try { padding: 1.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 1rem; position: relative; }
.try-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.try-title { font-weight: 800; font-size: .95rem; }
.try-sub { font-size: .8rem; color: var(--text-muted); font-weight: 600; }
.try-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.try-done { text-align: center; font-weight: 700; color: var(--good); font-size: .9rem; min-height: 1.5em; }
.try-reset { font-size: .8rem; color: var(--text-muted); min-height: 0; padding: 0; text-decoration: underline; }
.try-float { position: absolute; top: -14px; right: 18px; background: var(--ink); color: var(--ink-inverse); font-size: .72rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; }

/* How it works */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; counter-reset: step; }
.step { padding: 1.6rem; display: flex; flex-direction: column; gap: .5rem; }
.step-n { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; color: var(--accent); }
.step-title { font-weight: 800; }
.step-desc { font-size: .87rem; color: var(--text-secondary); }

/* Family report preview */
.report-split { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 3rem; align-items: center; }
.report-copy { display: flex; flex-direction: column; gap: 1rem; }
.report-copy p { color: var(--text-secondary); max-width: 46ch; }
.report-list { list-style: none; display: flex; flex-direction: column; gap: .6rem; font-size: .92rem; color: var(--text-secondary); }
.report-list li { display: flex; gap: 10px; align-items: baseline; }
.report-list li::before { content: "✓"; color: var(--accent); font-weight: 900; }
.mail { padding: 0; overflow: hidden; box-shadow: var(--shadow); border-radius: var(--radius-lg); }
.mail-head { padding: 1rem 1.3rem; border-bottom: 1px solid var(--gray-200); background: var(--gray-50); display: flex; flex-direction: column; gap: 2px; font-size: .8rem; color: var(--text-muted); }
.mail-head strong { color: var(--ink); font-size: .95rem; }
.mail-body { padding: 1.3rem; display: flex; flex-direction: column; gap: 1rem; }
.mail-hi { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.2; }
.mail-kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.mail-kpi { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 12px; padding: .7rem; text-align: center; }
.mail-kpi b { display: block; font-family: var(--font-display); font-size: 1.5rem; font-weight: 400; font-variant-numeric: tabular-nums; }
.mail-kpi span { font-size: .7rem; color: var(--text-muted); font-weight: 600; }
.mail-note { font-size: .88rem; color: var(--text-secondary); background: var(--accent-light); border-radius: 12px; padding: .8rem 1rem; }
.mail-bars { display: flex; align-items: flex-end; gap: 6px; height: 54px; }
.mail-bars i { flex: 1; background: var(--gray-300); border-radius: 4px 4px 2px 2px; }
.mail-bars i.now { background: var(--accent); }

/* Dashboard additions */
.today { padding: 1.4rem; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 1.2rem; align-items: center; border-radius: var(--radius-lg); background: var(--accent-light); border-color: transparent; }
.ring { width: 76px; height: 76px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-txt { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.today-label { font-size: .75rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .07em; }
.today-title { font-weight: 800; font-size: 1.05rem; }
.today-desc { font-size: .85rem; color: var(--text-secondary); }
.today-btn { background: var(--accent); color: #fff; border-radius: 12px; padding: 12px 20px; font-weight: 700; white-space: nowrap; }
.today-btn:hover { transform: translateY(-2px); }
.textsize { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: .9rem 1.2rem; border-radius: var(--radius); }
.ts-label { font-weight: 700; font-size: .9rem; }
.ts-sub { font-size: .78rem; color: var(--text-muted); }
.ts-opts { display: flex; gap: 4px; background: var(--gray-100); padding: 4px; border-radius: 12px; }
.ts-opt { min-height: 40px; min-width: 44px; border-radius: 9px; font-weight: 800; color: var(--text-muted); font-family: var(--font-display); }
.ts-opt.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }

/* Confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall 1.8s cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .2; } }

/* Progress report card */
.report-card { padding: 1.3rem 1.4rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.report-card .rc-body { flex: 1; min-width: 200px; }
.btn-small { border: 1.5px solid var(--gray-300); border-radius: 10px; padding: 8px 16px; min-height: 40px; font-size: .85rem; font-weight: 700; }
.btn-small:hover { background: var(--gray-50); }

/* ---------- Auth ---------- */
.auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-block: 2rem; background:
  radial-gradient(ellipse 80% 60% at 15% 10%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 60%),
  radial-gradient(ellipse 60% 50% at 85% 85%, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 55%), var(--bg); }
.auth-card { width: 100%; max-width: 440px; padding: 2.5rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
.auth-logo { justify-content: center; margin-bottom: .6rem; }
.auth-logo .logo-icon { background: var(--accent); width: 46px; height: 46px; border-radius: 14px; font-size: 24px; }
.auth-title { font-size: 1.9rem; text-align: center; }
.auth-sub { text-align: center; color: var(--text-muted); font-size: .9rem; margin-bottom: .6rem; }
.auth-error { background: var(--bad-bg); border: 1.5px solid var(--bad-border); color: var(--bad); padding: 10px 14px; border-radius: 10px; font-size: .88rem; font-weight: 600; }
.auth-switch { text-align: center; color: var(--text-muted); font-size: .88rem; }
.link { color: var(--accent); font-weight: 700; min-height: 0; padding: 0; font-size: inherit; }
.link:hover { text-decoration: underline; }
.auth-back { align-self: flex-start; font-size: .85rem; color: var(--text-muted); min-height: 0; padding: 0; }

/* ---------- App shell ---------- */
.navbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--nav-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--gray-200); }
.navbar-in { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 12px; max-width: 1100px; margin: 0 auto; }
.nb-links { display: flex; gap: 2px; }
.nb-link { padding: 7px 14px; border-radius: 8px; font-size: .875rem; font-weight: 500; color: var(--text-muted); min-height: 0; }
.nb-link:hover, .nb-link.active { color: var(--ink); background: var(--gray-100); }
.nb-link.active { font-weight: 700; }
.nb-user { display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--ink-inverse); display: grid; place-items: center; font-weight: 700; font-size: .9rem; flex-shrink: 0; }
.nb-name { font-size: .85rem; font-weight: 700; line-height: 1.2; }
.nb-logout { font-size: .75rem; color: var(--text-muted); min-height: 0; padding: 0; font-weight: 500; }
.nb-logout:hover { color: var(--ink); }
.nb-mobile { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--gray-200); padding: 8px max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); justify-content: space-around; }
.nb-m-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; min-height: 0; }
.nb-m-icon { font-size: 1.3rem; }
.nb-m-label { font-size: .66rem; font-weight: 600; color: var(--text-muted); }
.nb-m-item.active .nb-m-label { color: var(--ink); }
.app-main { max-width: 900px; margin: 0 auto; padding-block: 2rem 6rem; }

/* ---------- Dashboard ---------- */
.dash-hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
.dash-greeting { font-size: .85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
.dash-title { font-size: clamp(1.7rem, 4.5vw, 2.4rem); }
.streak { display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--ink-inverse); border-radius: 14px; padding: 12px 18px; flex-shrink: 0; }
.streak-num { font-size: 1.5rem; font-weight: 900; line-height: 1; }
.streak-label { font-size: .7rem; font-weight: 600; opacity: .7; }
.stats-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.stat { padding: 1.2rem; text-align: center; }
.stat.accent { background: var(--ink); border-color: var(--ink); color: var(--ink-inverse); }
.stat-icon { font-size: 1.3rem; }
.stat-val { font-family: var(--font-display); font-size: 1.8rem; font-variant-numeric: tabular-nums; }
.stat-label { font-size: .74rem; color: var(--text-muted); font-weight: 600; }

const summary = () => {
  const days = new Set(S.history.map(h => new Date(h.at).toDateString()))
  let streak = 0
  for (let d = 0; d < 60; d++) { if (days.has(new Date(now - d * DAY).toDateString())) streak++; else if (d > 0) break }
  return { sessions: S.history.length, points: S.history.reduce((a, h) => a + h.score, 0), streak: Math.max(streak, 1) + 4 }
}
const bestScores = () => {
  const map = {}
  for (const h of S.history) { const k = h.game + h.diff; if (!map[k] || map[k].score < h.score) map[k] = h }
  return Object.values(map).sort((a, b) => b.score - a.score)
}
const suggestDiff = game => {
  const last = S.history.filter(h => h.game === game).slice(0, 3)
  if (!last.length) return 'easy'
  const acc = last.reduce((a, h) => a + h.correct / h.total, 0) / last.length
  const top = last[0].diff
  if (acc >= .85) return top === 'easy' ? 'medium' : 'hard'
  if (acc < .5) return top === 'hard' ? 'medium' : 'easy'
  return top
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast pop'; t.textContent = msg
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200)
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return

}

    <div class="try-grid mb-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${m.cards.map(c => `<button class="mb-card ${c.flipped || c.matched ? 'flipped' : ''} ${c.matched ? 'matched' : ''}" data-mini="${c.i}" aria-label="${c.flipped || c.matched ? c.v : 'Face-down card'}">
      <div class="mb-inner"><div class="mb-face mb-front">?</div><div class="mb-face mb-back">${c.v}</div></div></button>`).join('')}</div>
    <div class="try-done">${done ? '🎉 Well done! That is one CogniMente exercise.' : ''}</div>

}
function flipMini(i) {
  const m = S.mini, c = m.cards[i]
  if (m.locked || c.flipped || c.matched) return
  c.flipped = true; m.sel.push(i)
  if (m.sel.length === 2) {
    const [a, b] = m.sel.map(k => m.cards[k])
    if (a.v === b.v) { a.matched = b.matched = true; m.sel = []; m.found++ }
    else { m.locked = true; setTimeout(() => { a.flipped = b.flipped = false; m.sel = []; m.locked = false; if (S.route === 'home') render() }, 800) }
  }
  render()
}

function todayPlan() {
  const goal = 3
  const today = S.history.filter(h => new Date(h.at).toDateString() === new Date().toDateString())
  const done = Math.min(goal, today.length)
  const playedIds = today.map(h => h.game)
  const nextGame = ['math', 'word', 'face', 'memory'].find(id => !playedIds.includes(id)) || 'memory'
  const g = GAMES[nextGame], diff = suggestDiff(nextGame)
  const C = 2 * Math.PI * 32, off = C * (1 - done / goal)
  return `<div class="today card fade-up" style="animation-delay:.05s">
    <div class="ring"><svg viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="32" fill="none" stroke="var(--surface)" stroke-width="8"/><circle cx="38" cy="38" r="32" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><div class="ring-txt">${done}/${goal}</div></div>
    <div><div class="today-label">Today's plan</div>
      <div class="today-title">${done >= goal ? 'Daily goal complete! 🎉' : `Next up: ${g.icon} ${g.name}`}</div>
      <div class="today-desc">${done >= goal ? 'Great job. Come back tomorrow to keep your streak.' : `${DIFF[diff]} level, picked from your recent results. About 3 minutes.`}</div></div>
    ${done >= goal ? '' : `<button class="today-btn" data-go="${g.route}">Start</button>`}
  </div>`
}

function startGame(id, diffKey) {
  const level = LEVELS[id].find(l => l.key === diffKey)
  if (id === 'face' && S.family.length < 2) { toast('Add at least 2 family members on the Family page first.'); return }
  const p = S.play = { phase: 'playing', diff: diffKey, level, correct: 0, idx: 0, started: Date.now(), locked: false }
  if (id === 'memory') {
    const items = shuffle(MEMORY_ITEMS).slice(0, level.pairs)
    p.cards = shuffle([...items, ...items]).map((v, i) => ({ i, v, flipped: false, matched: false }))
    p.sel = []; p.total = level.pairs
    render(); startCountdown(level.time, () => finishGame('memory'))
    return
  }
  p.total = level.n
  if (id === 'math') p.qs = Array.from({ length: level.n }, () => makeMath(diffKey))
  if (id === 'face') p.qs = makeFaces(level)
  if (id === 'word') p.qs = shuffle(WORDS).slice(0, level.n).map(w => makeWord(w, level.blanks))
  render(); startQuestionTimer(id)
}
function startQuestionTimer(id) { startCountdown(S.play.level.time, () => answer(id, null)) }

function makeMath(diff) {
  let a, b, op, ans
  const ops = diff === 'easy' ? ['+', '−'] : diff === 'medium' ? ['+', '−', '×'] : ['+', '−', '×', '÷']
  op = ops[rand(0, ops.length - 1)]
  const max = diff === 'easy' ? 10 : diff === 'medium' ? 20 : 50
  if (op === '+') { a = rand(1, max); b = rand(1, max); ans = a + b }
  if (op === '−') { a = rand(2, max); b = rand(1, a); ans = a - b }
  if (op === '×') { a = rand(2, diff === 'medium' ? 9 : 12); b = rand(2, 9); ans = a * b }
  if (op === '÷') { b = rand(2, 9); ans = rand(2, 10); a = b * ans }
  const opts = new Set([ans])
  while (opts.size < 4) { const d = ans + rand(-6, 6); if (d >= 0 && d !== ans) opts.add(d) }
  return { expr: `${a} ${op} ${b}`, ans, opts: shuffle([...opts]) }
}
function makeFaces(level) {
  const people = S.family
  const qs = []
  for (let i = 0; i < level.n; i++) {
    const target = people[i % people.length]
    const others = shuffle(people.filter(p => p.id !== target.id)).slice(0, Math.min(level.opts, people.length) - 1)
    qs.push({ person: target, ans: target.name.split(' ')[0], opts: shuffle([target, ...others]).map(p => p.name.split(' ')[0]) })
  }
  return shuffle(qs)
}
function makeWord(entry, blanks) {
  const w = entry.w
  const idxs = shuffle([...Array(w.length).keys()].filter(i => i > 0)).slice(0, blanks).sort((a, b) => a - b)
  const ans = idxs.map(i => w[i]).join('')
  const alpha = 'ABCDEFGHIJKLMNOPRSTUVWY'
  const opts = new Set([ans])
  while (opts.size < 4) { let s = ''; for (let k = 0; k < blanks; k++) s += alpha[rand(0, alpha.length - 1)]; opts.add(s) }
  return { word: w, hint: entry.hint, idxs, ans, opts: shuffle([...opts]) }
}

function topbar(id, label, sub) {

}
function feedbackHtml() {

function optClass(o) {
  const f = S.play.fb; if (!f) return ''
  if (String(o) === String(f.ans)) return 'good'

function flipCard(i) {
  const p = S.play, c = p.cards[i]
  if (p.locked || c.flipped || c.matched) return
  c.flipped = true; p.sel.push(i)
  if (p.sel.length === 2) {
    const [a, b] = p.sel.map(k => p.cards[k])
    if (a.v === b.v) {
      a.matched = b.matched = true; p.sel = []; p.correct++
      if (p.correct === p.total) { render(); stopTimer(); setTimeout(() => finishGame('memory'), 600); return }
    } else {
      p.locked = true
      setTimeout(() => { a.flipped = b.flipped = false; p.sel = []; p.locked = false; if (S.play === p) render() }, 900)
    }
  }
  render()
}

function wordBoard() {
  const p = S.play, q = p.qs[p.idx], f = p.fb

  const chars = q.word.split('').map((ch, i) => {
    if (!q.idxs.includes(i)) return `<div class="word-char">${ch}</div>`
    const shown = f ? (f.pick ? f.pick[k] : q.ans[k]) : '?'
    const cls = f ? (f.ok ? 'filled-good' : 'filled-bad') : ''
    k++
    return `<div class="word-char blank ${cls}">${shown}</div>`
  }).join('')
  return `<div class="play fade-up">
    ${topbar('word', 'Fill the Word', `Question ${p.idx + 1} of ${p.total}`)}
    ${p.level.hint ? `<div class="word-hint"><strong>💡 Hint:</strong> ${q.hint}</div>` : ''}
    <div class="word-card card pop"><div class="word-chars">${chars}</div></div>
    <div class="opt-grid">${q.opts.map(o => `<button class="opt ${optClass(o)}" data-ans="${o}" ${p.fb ? 'disabled' : ''}>${o.split('').join(' ')}</button>`).join('')}</div>
    ${feedbackHtml()}
  </div>`
}
function answer(id, pick) {
  const p = S.play; if (!p || p.fb || p.phase !== 'playing') return
  stopTimer()
  const q = p.qs[p.idx]
  const ok = pick !== null && String(pick) === String(q.ans)
  if (ok) p.correct++
  p.fb = { ok, pick, ans: q.ans, timeout: pick === null }
  render()
  setTimeout(() => {
    if (S.play !== p) return
    p.fb = null; p.idx++
    if (p.idx >= p.total) finishGame(id)
    else { p.left = p.level.time; render(); startQuestionTimer(id) }
  }, ok ? 800 : 1500)
}
function finishGame(id) {
  stopTimer()
  const p = S.play
  const dur = Math.round((Date.now() - p.started) / 1000)
  const acc = p.correct / p.total
  const timeBonus = id === 'memory' ? Math.max(0, p.left || 0) * 2 : Math.max(0, p.total * p.level.time - dur)
  const score = Math.round((p.correct * 80 + timeBonus) * MULT[p.diff])
  S.history.unshift({ id: nextId++, game: id, diff: p.diff, score, correct: p.correct, total: p.total, dur, at: Date.now() })
  S.play = { phase: 'result', score, correct: p.correct, total: p.total, acc, diff: p.diff }
  render()
  if (acc >= .8) confetti()
}
function result(id) {
  const r = S.play, g = GAMES[id], acc = Math.round(r.acc * 100)
  const emoji = acc >= 80 ? '🎉' : acc >= 50 ? '👏' : '💪'
  const msg = acc >= 80 ? 'Excellent! You did really well!' : acc >= 50 ? 'Good job! Keep practising.' : "Keep going, you'll get better every time!"
  const next = suggestDiff(id)
  return `<div class="result card pop">

}

function weeklyChart() {
  const days = []
  for (let d = 6; d >= 0; d--) {
    const date = new Date(now - d * DAY)
    const pts = S.history.filter(h => new Date(h.at).toDateString() === date.toDateString()).reduce((a, h) => a + h.score, 0)
    days.push({ label: date.toLocaleDateString('en-US', { weekday: 'short' }), pts })
  }
  const max = Math.max(1000, Math.ceil(Math.max(...days.map(d => d.pts)) / 500) * 500)
  const W = 560, H = 190, L = 40, B = 26, T = 14, bw = (W - L) / 7
  const y = v => T + (H - T - B) * (1 - v / max)
  const ticks = [0, max / 2, max]
  return `<div class="chart-card card fade-up" style="animation-delay:.1s">
    <div class="chart-head"><span class="chart-title">Points this week</span><span class="chart-note">${fmt(days.reduce((a, d) => a + d.pts, 0))} pts in 7 days</span></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of points per day this week">
      ${ticks.map(t => `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--gray-200)" stroke-width="1"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--text-muted)" font-family="Inter, sans-serif">${fmt(t)}</text>`).join('')}
      ${days.map((d, i) => {
        const x = L + i * bw + bw * .22, w = bw * .56, top = y(d.pts)
        return `<rect x="${x}" y="${top}" width="${w}" height="${Math.max(0, H - B - top)}" rx="6" fill="${i === 6 ? 'var(--accent)' : 'var(--gray-300)'}"/>
          ${d.pts ? `<text x="${x + w / 2}" y="${top - 5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-secondary)" font-family="Inter, sans-serif">${d.pts}</text>` : ''}
          <text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" font-size="11" font-weight="600" fill="${i === 6 ? 'var(--ink)' : 'var(--text-muted)'}" font-family="Inter, sans-serif">${i === 6 ? 'Today' : d.label}</text>`
      }).join('')}
    </svg></div></div>`
}

  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.confirmDel = +b.dataset.del; render() })
  document.querySelectorAll('[data-del-yes]').forEach(b => b.onclick = () => { S.family = S.family.filter(m => m.id !== +b.dataset.delYes); S.confirmDel = null; render() })
  document.querySelectorAll('[data-del-no]').forEach(b => b.onclick = () => { S.confirmDel = null; render() })
}
function syncFamForm() {
  const n = $('#f-name'), r = $('#f-rel')
  if (n) S.famForm.name = n.value
  if (r) S.famForm.rel = r.value
  S.famForm.error = ''
}

/* ---------- Boot ---------- */
const VALID = ['home', 'signin', 'signup', ...APP_ROUTES]
const initial = (location.hash || '').slice(1)
go(VALID.includes(initial) ? initial : 'home')
</script>
